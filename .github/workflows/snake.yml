name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#D4AF37&color_dots=#EBEDF0,#F3E3A8,#E2C35E,#C9A132,#8C6B1F
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#D4AF37&color_dots=#161B22,#3A2F12,#6B5419,#A8862A,#F5D68A

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
