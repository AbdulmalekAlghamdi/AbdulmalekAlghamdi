<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15141A"/>
      <stop offset="1" stop-color="#0B0B0F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4C9"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#9C7A22"/>
    </linearGradient>
    <style>
      .n { font-family: 'Didot','Bodoni 72',Georgia,serif; font-size: 52px; fill: url(#gold); }
      .l { font-family: 'Helvetica Neue',Helvetica,Arial,sans-serif; font-size: 12.5px; letter-spacing: 3px; fill: #B8B2A2; }
      .s { font-family: Georgia,serif; font-style: italic; font-size: 13px; fill: #7D7869; }
      .c { opacity: 0; animation: up .9s ease-out forwards; }
      .c2 { animation-delay: .15s } .c3 { animation-delay: .3s } .c4 { animation-delay: .45s }
      @keyframes up { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    </style>
  </defs>

  <g class="c">
    <rect x="10" y="10" width="276" height="150" rx="12" fill="url(#card)" stroke="#D4AF37" stroke-opacity="0.35"/>
    <text x="148" y="82" text-anchor="middle" class="n">Top 10%</text>
    <text x="148" y="114" text-anchor="middle" class="l">OF GRADUATES</text>
    <text x="148" y="138" text-anchor="middle" class="s">Computer Science &amp; Engineering</text>
  </g>
  <g class="c c2">
    <rect x="308" y="10" width="276" height="150" rx="12" fill="url(#card)" stroke="#D4AF37" stroke-opacity="0.35"/>
    <text x="446" y="82" text-anchor="middle" class="n">2</text>
    <text x="446" y="114" text-anchor="middle" class="l">HACKATHON ADVANCES</text>
    <text x="446" y="138" text-anchor="middle" class="s">Absher Tuwaiq · Channels by stc</text>
  </g>
  <g class="c c3">
    <rect x="606" y="10" width="276" height="150" rx="12" fill="url(#card)" stroke="#D4AF37" stroke-opacity="0.35"/>
    <text x="744" y="82" text-anchor="middle" class="n">3</text>
    <text x="744" y="114" text-anchor="middle" class="l">INDUSTRY ROLES</text>
    <text x="744" y="138" text-anchor="middle" class="s">T2 · Al-Rakeen · Channels by stc</text>
  </g>
  <g class="c c4">
    <rect x="904" y="10" width="286" height="150" rx="12" fill="url(#card)" stroke="#D4AF37" stroke-opacity="0.35"/>
    <text x="1047" y="82" text-anchor="middle" class="n">3</text>
    <text x="1047" y="114" text-anchor="middle" class="l">PROFESSIONAL CREDENTIALS</text>
    <text x="1047" y="138" text-anchor="middle" class="s">SDAIA &amp; KAUST · Udacity ×2</text>
  </g>
</svg>
