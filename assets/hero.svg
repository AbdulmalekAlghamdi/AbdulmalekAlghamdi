<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070A"/>
      <stop offset="0.55" stop-color="#0E0D12"/>
      <stop offset="1" stop-color="#0A0F14"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#D4AF37" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="tealHalo" cx="85%" cy="90%" r="40%">
      <stop offset="0" stop-color="#38B2AC" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#38B2AC" stop-opacity="0"/>
    </radialGradient>

    <!-- Moving gold shimmer across the name -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#8C6B1F"/>
      <stop offset="0.35" stop-color="#D4AF37"/>
      <stop offset="0.5" stop-color="#FFF4C9"/>
      <stop offset="0.65" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8C6B1F"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1 0; 1 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="goldStatic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <!-- Saudi-inspired eight-point star lattice -->
    <pattern id="stars" width="64" height="64" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#D4AF37" stroke-width="0.6" opacity="0.10">
        <rect x="20" y="20" width="24" height="24"/>
        <rect x="20" y="20" width="24" height="24" transform="rotate(45 32 32)"/>
        <path d="M0 32 H20 M44 32 H64 M32 0 V20 M32 44 V64"/>
      </g>
    </pattern>

    <mask id="fade">
      <radialGradient id="fadeGrad" cx="50%" cy="50%" r="60%">
        <stop offset="0" stop-color="#fff"/>
        <stop offset="1" stop-color="#000"/>
      </radialGradient>
      <rect width="1200" height="380" fill="url(#fadeGrad)"/>
    </mask>

    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#stars)" mask="url(#fade)"/>
  <rect width="1200" height="380" fill="url(#halo)"/>
  <rect width="1200" height="380" fill="url(#tealHalo)"/>

  <!-- Thin gold frame -->
  <rect x="18" y="18" width="1164" height="344" rx="14" fill="none" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="26" y="26" width="1148" height="328" rx="10" fill="none" stroke="#D4AF37" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Corner ornaments -->
  <g stroke="#D4AF37" stroke-width="1.4" fill="none" opacity="0.8">
    <path d="M40 70 V40 H70"/><path d="M1160 70 V40 H1130"/>
    <path d="M40 310 V340 H70"/><path d="M1160 310 V340 H1130"/>
  </g>

  <!-- Floating gold dust -->
  <g fill="#F5D68A">
    <circle cx="180" cy="300" r="1.6" opacity="0"><animate attributeName="cy" values="300;80" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="320" r="1.1" opacity="0"><animate attributeName="cy" values="320;60" dur="12s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="12s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="310" r="1.4" opacity="0"><animate attributeName="cy" values="310;70" dur="10s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="330" r="1" opacity="0"><animate attributeName="cy" values="330;90" dur="11s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="11s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="335" r="1.2" opacity="0"><animate attributeName="cy" values="335;50" dur="13s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="13s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="250" r="1" opacity="0"><animate attributeName="cy" values="250;60" dur="8s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="8s" begin="5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Arabic name -->
  <text x="600" y="98" text-anchor="middle" font-family="'Geeza Pro','Noto Naskh Arabic','Segoe UI',Tahoma,sans-serif"
        font-size="26" fill="#D4AF37" opacity="0" letter-spacing="1">عبدالملك الغامدي
    <animate attributeName="opacity" from="0" to="0.9" dur="1.2s" fill="freeze"/>
  </text>

  <!-- Name -->
  <text x="600" y="182" text-anchor="middle" font-family="'Didot','Bodoni 72','Playfair Display',Georgia,'Times New Roman',serif"
        font-size="60" font-weight="400" letter-spacing="8" textLength="960" lengthAdjust="spacing" fill="url(#gold)" filter="url(#soft)">ABDULMALEK ALGHAMDI</text>

  <!-- Divider with diamond -->
  <g>
    <rect x="360" y="212" width="480" height="1" fill="url(#goldStatic)">
      <animate attributeName="width" values="0;480" dur="1.4s" fill="freeze"/>
      <animate attributeName="x" values="600;360" dur="1.4s" fill="freeze"/>
    </rect>
    <rect x="594" y="206.5" width="12" height="12" fill="#07070A" stroke="#D4AF37" stroke-width="1.2" transform="rotate(45 600 212.5)"/>
  </g>

  <!-- Role line -->
  <text x="600" y="256" text-anchor="middle" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif"
        font-size="17" letter-spacing="6" fill="#E9E4D6" opacity="0.92">PRODUCT MANAGER  ·  SYSTEM ARCHITECT  ·  AI ENGINEER</text>

  <!-- Tagline -->
  <text x="600" y="296" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic"
        font-size="16" fill="#9C9686" letter-spacing="1.5">Where business clarity meets engineered intelligence — Saudi Arabia</text>

  <!-- Light sweep -->
  <rect x="-300" y="0" width="160" height="380" fill="#FFF4C9" opacity="0.04" transform="skewX(-20)">
    <animate attributeName="x" values="-300;1500" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
